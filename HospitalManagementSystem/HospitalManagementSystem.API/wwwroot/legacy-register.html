<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Hospital Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body class="bg-light">
    <div class="login-screen">
        <div class="login-container registration-container">
            <div class="login-header">
                <div class="hospital-logo">
                    <i class="fas fa-hospital-alt"></i>
                    <h2>Create Account</h2>
                </div>
                <p>Join the Hospital Management System</p>
            </div>

            <form id="registerForm" class="login-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="regUsername"><i class="fas fa-user"></i> Username</label>
                        <input type="text" id="regUsername" placeholder="Choose a username" required>
                    </div>
                    <div class="form-group">
                        <label for="regEmail"><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="regEmail" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regFullName"><i class="fas fa-id-card"></i> Full Name</label>
                    <input type="text" id="regFullName" placeholder="Enter your full name" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="regPassword"><i class="fas fa-lock"></i> Password</label>
                        <input type="password" id="regPassword" placeholder="Create a password" required>
                    </div>
                    <div class="form-group">
                        <label for="regConfirmPassword"><i class="fas fa-lock"></i> Confirm Password</label>
                        <input type="password" id="regConfirmPassword" placeholder="Confirm password" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regUserType"><i class="fas fa-users-cog"></i> I am a:</label>
                    <select id="regUserType" class="form-control" required>
                        <option value="Patient">Patient</option>
                        <option value="Doctor">Doctor</option>
                        <option value="Nurse">Nurse</option>
                        <option value="Receptionist">Receptionist</option>
                        <option value="Accountant">Accountant</option>
                    </select>
                </div>

                <div class="info-box mb-3" id="approvalNotice" style="display: none;">
                    <i class="fas fa-info-circle"></i> Staff accounts require Admin approval before first login.
                </div>

                <button type="submit" class="btn-login" id="registerBtn">
                    <i class="fas fa-user-plus"></i> Register
                </button>

                <div class="login-footer mt-3">
                    <p>Already have an account? <a href="index.html">Login here</a></p>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script>
        // Simple helper for registration page
        document.getElementById('regUserType').addEventListener('change', (e) => {
            const notice = document.getElementById('approvalNotice');
            notice.style.display = e.target.value === 'Patient' ? 'none' : 'block';
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const fullName = document.getElementById('regFullName').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const userType = document.getElementById('regUserType').value;

            if (password !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }

            try {
                const response = await fetch(`${CONFIG.API_URL}/Auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, email, fullName, userType })
                });


                if (response.ok) {
                    alert('Registration successful! ' + (userType === 'Patient' ? 'You can now login.' : 'Please wait for Admin approval.'));
                    window.location.href = 'index.html';
                } else {
                    const error = await response.json();
                    alert(error.message || 'Registration failed');
                }
            } catch (err) {
                alert('Connection error');
            }
        });
    </script>
</body>

</html>
