<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rutabo HMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="root"></div>

  <template id="tpl-login">
    <div class="auth-shell">
      <div class="auth-bg"></div>
      <div class="auth-card">
        <div class="auth-brand">
          <div class="brand-logo"><i class="fa-solid fa-hospital"></i></div>
          <div>
            <h1>Rutabo HMS</h1>
            <p>Centre de Santé · Hospital Management</p>
          </div>
        </div>
        <h2>Welcome back</h2>
        <p class="muted">Sign in to your workspace</p>
        <form id="loginForm" class="form">
          <label>Username
            <input name="username" placeholder="e.g. admin" autocomplete="username" required />
          </label>
          <label>Password
            <div class="pw">
              <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
              <button type="button" class="pw-toggle" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
            </div>
          </label>
          <div class="row-between">
            <label class="check"><input type="checkbox" name="remember" /> Remember me</label>
            <a href="#" class="link">Forgot password?</a>
          </div>
          <button class="btn btn-primary btn-block" type="submit">
            <span class="label">Sign in</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
          <div id="loginErr" class="alert hidden"></div>
        </form>
        <div class="quick-accounts">
          <p class="muted small">Quick demo logins · password <code>Admin@123</code></p>
          <div class="chips">
            <button class="chip" data-u="admin">Admin</button>
            <button class="chip" data-u="dr.smith">Doctor</button>
            <button class="chip" data-u="nurse.alice">Nurse</button>
            <button class="chip" data-u="reception">Reception</button>
            <button class="chip" data-u="patient.john">Patient</button>
            <button class="chip" data-u="accountant">Accountant</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-app">
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="side-brand">
          <div class="brand-logo"><i class="fa-solid fa-hospital"></i></div>
          <div class="brand-text">
            <strong>Rutabo HMS</strong>
            <span>Health Centre</span>
          </div>
        </div>
        <nav class="side-nav" id="sideNav"></nav>
        <div class="side-foot">
          <div class="user-card">
            <div class="avatar" id="sideAvatar">A</div>
            <div class="meta">
              <strong id="sideName">User</strong>
              <span id="sideRole">Role</span>
            </div>
          </div>
          <button class="btn btn-ghost btn-block" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="icon-btn only-mobile" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
          <div class="search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input placeholder="Search patients, doctors, appointments..." />
          </div>
          <div class="top-actions">
            <button class="icon-btn" title="Notifications"><i class="fa-regular fa-bell"></i><span class="dot"></span></button>
            <button class="icon-btn" title="Messages"><i class="fa-regular fa-comment"></i></button>
            <div class="avatar small" id="topAvatar">A</div>
          </div>
        </header>

        <section id="view" class="view"></section>
      </main>
    </div>
  </template>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
